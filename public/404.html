<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23C85A32'/><path d='M30 70 L50 28 L70 70 L56 70 L50 54 L44 70 Z' fill='%23FDFBF7'/><circle cx='50' cy='42' r='5' fill='%23B8860B'/></svg>" />
    <title>KalaConnect AI — From Your Craft to the World.</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        var segments = path.split('/').filter(Boolean);
        var isGitHubPages = window.location.hostname.endsWith('github.io');
        var repo = (isGitHubPages && segments.length > 0) ? ('/' + segments[0]) : '';
        var routeSegments = isGitHubPages ? segments.slice(1) : segments;
        var route = '/' + routeSegments.join('/');

        var cleanSearch = search ? '&' + search.replace(/^\?/, '') : '';
        var target = repo + '/?route=' + encodeURIComponent(route) + cleanSearch + hash;

        window.location.replace(target);
      })();
    </script>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #FDFBF7;
        color: #1A1D1B;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .loading-box {
        text-align: center;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #EAE1D5;
        border-top-color: #C85A32;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .brand {
        font-weight: 700;
        font-size: 1.25rem;
        color: #C85A32;
        margin-bottom: 4px;
      }
      .desc {
        color: #636A66;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <div class="loading-box">
      <div class="spinner"></div>
      <div class="brand">KalaConnect AI</div>
      <div class="desc">Loading handcrafted collection...</div>
    </div>
  </body>
</html>
